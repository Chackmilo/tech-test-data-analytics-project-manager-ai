name: Mythril Programme Verification & CI Pipeline

on:
  push:
    branches: [main, "submission/**"]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Audit & Verification (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint codebase with Ruff
        run: |
          ruff check src/ tests/ verify.py mutation_test.py

      - name: Run deterministic verification harness (283 checks)
        run: |
          python verify.py

      - name: Run adversarial mutation test suite (8 cases)
        run: |
          python mutation_test.py

      - name: Run pytest test suite
        run: |
          pytest -v
